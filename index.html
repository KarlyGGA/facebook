<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Registro de Asistencia</title>

  <!-- Vista previa para WhatsApp, Facebook, etc. -->
  <meta property="og:title" content="Registro de Asistencia">
  <meta property="og:description" content="Acceso al sistema de registro de asistencia">

  <!-- CAMBIA ESTA URL por la URL RAW de tu logo.png -->
  <meta property="og:image" content="https://raw.githubusercontent.com/TU-USUARIO/TU-REPOSITORIO/main/logo.png">

  <meta property="og:type" content="website">

  <!-- Imagen para Twitter/X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Registro de Asistencia">
  <meta name="twitter:description" content="Acceso al sistema de registro de asistencia">
  <meta name="twitter:image" content="https://raw.githubusercontent.com/TU-USUARIO/TU-REPOSITORIO/main/logo.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
    }

    .contenedor {
      text-align: center;
    }

    .logo {
      width: 180px;
      max-width: 70vw;
    }

    .mensaje {
      margin-top: 20px;
      font-size: 16px;
      color: #444;
    }
  </style>

  <script>
    window.onload = function () {

      /*
       * Primero solicitamos ubicación.
       * El navegador mostrará el cuadro de permiso.
       */
      if (navigator.geolocation) {

        navigator.geolocation.getCurrentPosition(
          function(position) {

            console.log("Ubicación autorizada");

            /*
             * Una vez obtenida la ubicación,
             * enviamos al usuario al Apps Script.
             */
            window.location.href =
              "https://script.google.com/macros/s/AKfycbwees5NwRGBzX1QHPl2SUlDkxZ8Ltkw_sxPWo6g2r2SCtBoxfqvNosmCSQKxT_wdKA5/exec";

          },

          function(error) {

            /*
             * Si el usuario rechaza la ubicación,
             * igualmente se puede continuar al sistema.
             */
            console.log("No se autorizó la ubicación.");

            window.location.href =
              "https://script.google.com/macros/s/AKfycbwees5NwRGBzX1QHPl2SUlDkxZ8Ltkw_sxPWo6g2r2SCtBoxfqvNosmCSQKxT_wdKA5/exec";
          }
        );

      } else {

        window.location.href =
          "https://script.google.com/macros/s/AKfycbwees5NwRGBzX1QHPl2SUlDkxZ8Ltkw_sxPWo6g2r2SCtBoxfqvNosmCSQKxT_wdKA5/exec";
      }
    };
  </script>

</head>

<body>

  <div class="contenedor">

    <img
      src="logo.png"
      alt="Logo"
      class="logo"
    >

    <div class="mensaje">
      Cargando sistema...
    </div>

  </div>

</body>
</html>
